name: Publish release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-test-apks:
    name: Build release-smoke APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd android && ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: release-instrumentation-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error

  android-compatibility:
    name: Android API ${{ matrix.api }} release smoke
    runs-on: ubuntu-latest
    needs: android-test-apks
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 27
            arch: x86
          - api: 28
            arch: x86_64
          - api: 29
            arch: x86_64
          - api: 30
            arch: x86_64
          - api: 31
            arch: x86_64
          - api: 32
            arch: x86_64
          - api: 33
            arch: x86_64
          - api: 34
            arch: x86_64
          - api: 35
            arch: x86_64
          - api: 36
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-instrumentation-apks
          path: instrumentation-apks
      - uses: reactivecircus/android-emulator-runner@v2
        id: primary_emulator
        continue-on-error: true
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          profile: Nexus 6
          emulator-boot-timeout: 1200
          disable-animations: false
          pre-emulator-launch-script: sudo chmod 666 /dev/kvm
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/run_android_instrumentation.sh instrumentation-apks/debug/app-debug.apk instrumentation-apks/androidTest/debug/app-debug-androidTest.apk android-test-results/api-${{ matrix.api }}
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.primary_emulator.outcome == 'failure'
        env:
          ANDROID_SERIAL: emulator-5556
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          profile: Nexus 6
          avd-name: retry-${{ matrix.api }}
          emulator-port: 5556
          emulator-boot-timeout: 1200
          disable-animations: false
          pre-emulator-launch-script: sudo chmod 666 /dev/kvm
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/run_android_instrumentation.sh instrumentation-apks/debug/app-debug.apk instrumentation-apks/androidTest/debug/app-debug-androidTest.apk android-test-results/api-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results-api-${{ matrix.api }}
          path: android-test-results/api-${{ matrix.api }}/
          retention-days: 7
          if-no-files-found: warn

  ios-artifact:
    name: Build iOS release artifact
    runs-on: macos-15
    # The only platform with a signed, installable release artifact is Android. iOS is unsigned
    # and experimental (see Important Architecture.md) -- a flaky macOS runner, a dropped Xcode
    # image, or an iOS-only test regression must not block the Android release. continue-on-error
    # makes this job's outcome neutral for `needs:` evaluation below; publish-ios attaches whatever
    # this job produced (possibly nothing) after the Android release is already available.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      # Gate the artifact on the same suite the PR gate runs. An IPA that was never unit-tested
      # is worse than no IPA: it looks like a release.
      - name: Verify iOS
        run: ./scripts/test_ios.sh
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          ./scripts/bootstrap_ios_app.sh
      # `swift test` above runs against the macOS SDK, which compiles out every `#if os(iOS)`
      # body. Gate the artifact on the simulator suite too, so an IPA is never published on the
      # strength of a suite that never built the code the IPA actually contains.
      - name: iOS simulator unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/AkshravaApp.xcodeproj \
            -scheme AkshravaApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
      # Unsigned on purpose. No Apple signing identity is configured for this repository, and
      # producing an "IPA" that cannot install is less honest than shipping a clearly-labelled
      # unsigned archive that a maintainer re-signs with their own team. Never emit a file named
      # like an installable build unless it actually is one.
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/AkshravaApp.xcodeproj \
            -scheme AkshravaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AkshravaApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
      - name: Package the unsigned payload and symbols
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/AkshravaApp.xcarchive"
          test -d "$archive/Products/Applications/AkshravaApp.app"
          mkdir -p ios-release-assets "$RUNNER_TEMP/payload/Payload"
          cp -R "$archive/Products/Applications/AkshravaApp.app" "$RUNNER_TEMP/payload/Payload/"
          ( cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/ios-release-assets/Akshrava-${version}-ios-unsigned.ipa" Payload )
          # dSYMs are the only way to symbolicate a crash from a field device; they are not in
          # the app bundle and are unrecoverable once the runner is gone.
          if [ -d "$archive/dSYMs" ]; then
            ( cd "$archive" && zip -qry "$GITHUB_WORKSPACE/ios-release-assets/Akshrava-${version}-ios-dSYMs.zip" dSYMs )
          fi
          # Write the manifest outside the directory being hashed: a redirect into it creates the
          # target before the glob expands, and the checksum file would list itself as empty.
          # Bare file names so `sha256sum -c` works for someone who downloaded them side by side.
          ( cd ios-release-assets && shasum -a 256 * ) > "$RUNNER_TEMP/SHA256SUMS-ios.txt"
          mv "$RUNNER_TEMP/SHA256SUMS-ios.txt" ios-release-assets/SHA256SUMS-ios.txt
          ls -la ios-release-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-assets
          path: ios-release-assets
          retention-days: 7
          if-no-files-found: warn

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - run: ./scripts/validate_compose_config.sh
      - run: ./scripts/test_cloud_preflight.sh
      - run: ./scripts/gcp_preflight.sh --ci

  publish:
    runs-on: ubuntu-latest
    # Android is the signed field artifact. Do not make its publication wait for the experimental
    # unsigned iOS job; publish-ios below attaches iOS assets later if that independent job wins.
    needs: [android-compatibility, configuration]
    env:
      AKSHRAVA_ENV: development
      DEV_AUTH_BYPASS: "true"
      DETECTOR: noop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify release tag matches artifacts
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83' '.[dev]' build pip-audit
          pytest -q
          ruff check akshrava_backend tests
          python -m pip check
          pip-audit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Materialize release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
      - name: Build Android artifact
        working-directory: android
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Package signed APK and checksums
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          apk="release-assets/Akshrava-${version}-universal.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Record the bare file name, not the build-time directory: SHA256SUMS.txt is published
          # next to the APK, and `sha256sum -c SHA256SUMS.txt` must verify for someone who
          # downloaded the two files side by side.
          ( cd release-assets && sha256sum "$(basename "$apk")" ) > SHA256SUMS.txt
          python scripts/build_apk_download_site.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --apk-name "$(basename "$apk")" \
            --sha256 "$(cut -d ' ' -f 1 SHA256SUMS.txt)" \
            --out release-site
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          # Derived, never restated: a manifest naming a revision the migrations do not actually
          # head at tells an operator a deployment is migrated when the API will refuse to start.
          from check_release_version import alembic_head_revision
          tag = os.environ["GITHUB_REF_NAME"]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "tag": tag,
              "commit": commit,
              "apk": next(path.name for path in Path("release-assets").glob("*.apk")),
              "apk_sha256": Path("SHA256SUMS.txt").read_text(encoding="utf-8").split()[0],
              "supported_android_api_levels": list(range(26, 37)),
              "release_smoke_tested_android_api_levels": list(range(26, 37)),
              "database_schema_revision": alembic_head_revision(Path(".")),
              "detector_default": "noop",
              "yolo_weights_sha256": os.environ.get("YOLO_WEIGHTS_SHA256", ""),
              # The independent publish-ios job updates this only if an iOS payload was actually
              # built and attached. Android publication never waits for that experimental job.
              "ios_ipa": "",
              "ios_ipa_signed": False,
              "ios_minimum_os_version": "14.0",
              "artifacts": [
                  "Akshrava signed universal APK (Android API 26–36)",
                  "SHA256SUMS.txt",
              ],
              "notes": (
                  "Model weights are not published here; pin SHA in cloud/gcp/terraform.tfvars "
                  "before detector=remote. Any iOS payload attached later by this workflow is "
                  "unsigned and must be re-signed; no Apple signing identity is configured."
              ),
          }
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              release-assets/* \
              SHA256SUMS.txt \
              release-manifest.json
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Akshrava $GITHUB_REF_NAME" \
              --generate-notes \
              release-assets/* \
              SHA256SUMS.txt \
              release-manifest.json
          fi
      - name: Upload release site
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: release-site
          if-no-files-found: error

  publish-ios:
    runs-on: ubuntu-latest
    needs: [publish, ios-artifact]
    # ios-artifact is best-effort. This follow-up must never change the Android release outcome,
    # and may have nothing to do when Xcode/the simulator/artifact build failed.
    if: always() && needs.publish.result == 'success'
    continue-on-error: true
    steps:
      - name: Download optional iOS assets
        id: ios_download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-release-assets
          path: ios-release-assets
      - name: Attach verified iOS assets and update the release manifest
        if: steps.ios_download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(ios-release-assets/*.ipa)
          test "${#ipa_files[@]}" -eq 1
          gh release download "$GITHUB_REF_NAME" --pattern release-manifest.json --dir .
          IOS_IPA_NAME="$(basename "${ipa_files[0]}")" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("release-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["ios_ipa"] = os.environ["IOS_IPA_NAME"]
          asset_names = {asset.name for asset in Path("ios-release-assets").iterdir()}
          additions = ["Akshrava UNSIGNED iOS payload (.ipa, iOS 14+) — re-sign before install"]
          if any("dSYMs" in name for name in asset_names):
              additions.append("Akshrava iOS dSYMs")
          if "SHA256SUMS-ios.txt" in asset_names:
              additions.append("SHA256SUMS-ios.txt")
          for item in additions:
              if item not in manifest["artifacts"]:
                  manifest["artifacts"].append(item)
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          gh release upload "$GITHUB_REF_NAME" --clobber \
            ios-release-assets/* \
            release-manifest.json

  pages-build:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-site
          path: release-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release-site

  pages-deploy:
    runs-on: ubuntu-latest
    needs: pages-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
