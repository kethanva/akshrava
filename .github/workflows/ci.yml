name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: akshrava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      AKSHRAVA_ENV: development
      DEV_AUTH_BYPASS: "true"
      DETECTOR: noop
      DATABASE_URL: "postgresql+asyncpg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/akshrava_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Create the verified backend environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83'
          .venv/bin/python -m pip install '.[dev]' pip-audit
      # Apply migrations on a clean DB before tests so pytest does not create tables
      # via SQLAlchemy metadata and then leave alembic unable to upgrade.
      - run: .venv/bin/alembic upgrade head
      - run: ../scripts/verify_phases.sh
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/pip-audit

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate_compose_config.sh
      - run: ./scripts/test_cloud_preflight.sh
      - run: docker build --build-arg INSTALL_YOLO=false -t akshrava-api-ci backend

  gcp-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - run: ./scripts/gcp_preflight.sh --ci

  android:
    # Test steps run on pull requests *and* pushes to main: a merge commit is not the PR head
    # and was previously never Android-tested. The participant client is this APK.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon :app:testDebugUnitTest

  ios:
    # Test steps run on pull requests *and* pushes to main: a merge commit is not the PR head
    # and was previously never iOS-tested. Archive/IPA steps stay PR-only to bound macOS minutes
    # and because iOS remains an unsigned prototype (NOT_NOW.md).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain. scripts/test_ios.sh refuses to run under Command Line Tools because
      # that toolchain has hung on emit-module for this package; select full Xcode explicitly so
      # a runner-image default change cannot silently switch the compiler underneath the gate.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift --version
      # Builds the library, runs the XCTest suite, checks backend/android/iOS version parity, and
      # runs the safety-boundary term audit over the Swift sources.
      - name: iOS unit + integration suite
        run: ./scripts/test_ios.sh
      # The installable artifact is generated, not committed, so a spec that no longer produces a
      # project must fail here rather than at tag time when a release is already in flight.
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          ./scripts/bootstrap_ios_app.sh
          test -d ios/AkshravaApp.xcodeproj
      # THE iOS GATE. `swift test` above builds for macOS, where every `#if os(iOS)` body is
      # compiled out -- the capture pipeline, the audio/TTS path and the UIKit layer are all
      # excluded, so that suite proves nothing about the code that actually runs on a phone.
      # This step is what compiles AND runs those bodies. It has already caught a test calling a
      # method that does not exist (`CaptureController.stop()`), which macOS silently accepted for
      # as long as the iOS branch was never built.
      - name: iOS simulator unit tests (compiles + runs the #if os(iOS) code)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/AkshravaApp.xcodeproj \
            -scheme AkshravaApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
      - name: Build the unsigned archive artifact
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p ios-pr-artifacts
          # Library release binary for PR inspection (not installable).
          (cd ios/Akshrava && swift build -c release)
          cp -R ios/Akshrava/.build/release/Modules ios-pr-artifacts/swift-modules || true
          # Unsigned .app archive — same honesty rule as release.yml (not named like a signed IPA).
          xcodebuild archive \
            -project ios/AkshravaApp.xcodeproj \
            -scheme AkshravaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AkshravaApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          test -d "$RUNNER_TEMP/AkshravaApp.xcarchive/Products/Applications/AkshravaApp.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$RUNNER_TEMP/AkshravaApp.xcarchive/Products/Applications/AkshravaApp.app" \
            "$RUNNER_TEMP/payload/Payload/"
          ( cd "$RUNNER_TEMP/payload" && zip -qry \
            "$GITHUB_WORKSPACE/ios-pr-artifacts/Akshrava-pr-ios-unsigned.ipa" Payload )
          cp ios/AkshravaApp.xcodeproj/project.pbxproj ios-pr-artifacts/project.pbxproj
          ( cd ios-pr-artifacts && shasum -a 256 * ) > "$RUNNER_TEMP/SHA256SUMS-ios-pr.txt"
          mv "$RUNNER_TEMP/SHA256SUMS-ios-pr.txt" ios-pr-artifacts/SHA256SUMS-ios-pr.txt
          ls -la ios-pr-artifacts
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: ios-pr-artifacts
          path: ios-pr-artifacts/
          retention-days: 7
          if-no-files-found: warn
